    };

  <script>
    // Garantia de segurança de abertura: oculta a splash screen após 2,5s caso ocorra qualquer atraso
    setTimeout(function() {
      var splash = document.getElementById("boot-splash");
      if (splash && !splash.classList.contains("is-dismissed")) {
        splash.classList.add("is-dismissed");
        setTimeout(function() { if (splash && splash.parentNode) splash.style.display = "none"; }, 250);
      }
    }, 2500);
  </script>
