name: Build & Release Lumina TV APK (v2.2.1)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 (para baixar vendor e rodar testes)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Baixar bibliotecas vendor reais (hls.js 1.5.15 e mpegts.js 1.7.3)
        run: |
          if [ -f "../lumina-tv/tools/baixar-vendor.sh" ]; then
            chmod +x ../lumina-tv/tools/baixar-vendor.sh
            ../lumina-tv/tools/baixar-vendor.sh
          elif [ -f "lumina-tv/tools/baixar-vendor.sh" ]; then
            chmod +x lumina-tv/tools/baixar-vendor.sh
            lumina-tv/tools/baixar-vendor.sh
          else
            mkdir -p app/src/main/assets/app/js/vendor
            curl -fsSL "https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js" -o app/src/main/assets/app/js/vendor/hls.min.js
            curl -fsSL "https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js" -o app/src/main/assets/app/js/vendor/mpegts.min.js
          fi

      - name: Sincronizar assets se lumina-tv/app existir no repositório
        run: |
          if [ -d "../lumina-tv/app" ]; then
            chmod +x scripts/sync-assets.sh
            ./scripts/sync-assets.sh ../lumina-tv/app
          elif [ -d "lumina-tv/app" ]; then
            chmod +x scripts/sync-assets.sh
            ./scripts/sync-assets.sh lumina-tv/app
          else
            echo "Usando app/src/main/assets/app já versionado no repositório."
          fi

      - name: Validar SVGs da marca (brand/) e atualizar PNGs via rsvg-convert (opcional se alterar SVGs)
        run: |
          if [ -f "brand/logo-mark.svg" ] && command -v rsvg-convert >/dev/null 2>&1; then
            echo "rsvg-convert disponível para regeneração a partir de brand/*.svg"
          fi

      - name: Validar e configurar Keystore de Assinatura
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Secrets de assinatura ausentes! Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD em Settings -> Secrets and variables -> Actions para que o APK novo sempre instale por cima do antigo sem erro de assinatura."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > lumina-release-key.jks
          cat <<EOF > keystore.properties
          storeFile=../lumina-release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Verificar Kotlin (rápido, sem compilar)
        run: |
          python3 tools/verificar-kotlin.py app/src/main/java

      - name: Compilar APK Debug e Release Assinado
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/lumina-tv.apk
          sha256sum app/build/outputs/apk/release/lumina-tv.apk > app/build/outputs/apk/release/lumina-tv.apk.sha256

      - name: Publicar APK de Release como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: lumina-tv-v2.2.1-firetv-release-apk
          path: |
            app/build/outputs/apk/release/lumina-tv.apk
            app/build/outputs/apk/release/lumina-tv.apk.sha256
          if-no-files-found: error

      - name: Publicar Release Automática no GitHub (quando enviar tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/lumina-tv.apk
            app/build/outputs/apk/release/lumina-tv.apk.sha256
          generate_release_notes: true
