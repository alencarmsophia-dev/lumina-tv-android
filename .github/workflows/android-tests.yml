name: Android Quality Assurance & Emulator Matrix (v2.2.0)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static Analysis & Core JS Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Executar testes unitários do núcleo JavaScript
        run: |
          mkdir -p tests
          cat << 'EOF' > tests/core-js.test.js
          const assert = require('assert');
          const fs = require('fs');
          const path = require('path');

          console.log('==> Validando integridade dos módulos core JS em assets...');
          const jsDir = path.join(__dirname, '../app/src/main/assets/app/js');
          assert(fs.existsSync(path.join(jsDir, 'data/classifier.js')), 'classifier.js ausente');
          assert(fs.existsSync(path.join(jsDir, 'data/stream-json.js')), 'stream-json.js ausente');
          assert(fs.existsSync(path.join(jsDir, 'workers/import-worker.js')), 'import-worker.js ausente');
          assert(fs.existsSync(path.join(jsDir, 'data/catalog.js')), 'catalog.js ausente');

          // Valida que o parser incremental de JSON funciona
          const StreamJson = require(path.join(jsDir, 'data/stream-json.js'));
          let count = 0;
          const p = StreamJson.createParser({ onItem: () => { count++; } });
          p.write('[{"id":1},{"id":2}]');
          p.end();
          assert.strictEqual(count, 2, 'StreamJson deve extrair exatamente 2 itens');

          console.log('✓ Testes de JavaScript concluídos com sucesso!');
          EOF
          node tests/core-js.test.js

      - name: Executar Lint Release e Testes Unitários Android
        run: |
          gradle lintRelease testDebugUnitTest --no-daemon

      - name: Conferir integridade de bibliotecas vendor e APK release
        run: |
          # Confere que os arquivos hls.min.js e mpegts.min.js estão presentes
          VENDOR_DIR="app/src/main/assets/app/js/vendor"
          if [ -d "$VENDOR_DIR" ]; then
            ls -lh "$VENDOR_DIR"
          fi

  emulator-matrix:
    name: Emulator Matrix (API ${{ matrix.api-level }} - ${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [static-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 22
            target: default
            arch: x86
            profile: "Low-RAM 1GB Phone (API 22)"
            cores: 1
            ram: "1024M"
            heap: "64M"
          - api-level: 24
            target: default
            arch: x86
            profile: "Mid 1.5GB 720p (API 24)"
            cores: 2
            ram: "1536M"
            heap: "128M"
          - api-level: 27
            target: default
            arch: x86
            profile: "Android Go 1GB (API 27)"
            cores: 2
            ram: "1024M"
            heap: "96M"
          - api-level: 28
            target: android-tv
            arch: x86
            profile: "Android TV 1080p (API 28)"
            cores: 2
            ram: "2048M"
            heap: "192M"
          - api-level: 30
            target: android-tv
            arch: x86
            profile: "Android TV 720p (API 30)"
            cores: 2
            ram: "2048M"
            heap: "192M"
          - api-level: 34
            target: google_apis
            arch: x86_64
            profile: "Modern 3GB Phone (API 34)"
            cores: 4
            ram: "3072M"
            heap: "256M"

    steps:
      - name: Habilitar KVM no Runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK Debug
        run: |
          gradle assembleDebug --no-daemon

      - name: Executar Teste em Emulador com Hardware Limitado
        uses: reactivecircus/android-emulator-runner@v2.30.1
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          avd-name: lumina_test_avd
          script: |
            chmod +x tools/smoke.sh
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            tools/smoke.sh

      - name: Fazer Upload de Artefatos de Diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-api-${{ matrix.api-level }}
          path: |
            build/test-artifacts/
            RELATORIO-TESTES.md
          if-no-files-found: ignore
