name: Diagnóstico de Abertura em Emuladores (v2.2.1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Compilar APKs Debug e Release (R8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Baixar bibliotecas vendor reais
        run: |
          mkdir -p app/src/main/assets/app/js/vendor
          curl -fsSL "https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js" -o app/src/main/assets/app/js/vendor/hls.min.js
          curl -fsSL "https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js" -o app/src/main/assets/app/js/vendor/mpegts.min.js

      - name: Compilar APK Debug e Release
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Salvar APKs compilados como artefatos temporários
        uses: actions/upload-artifact@v4
        with:
          name: apks-para-diagnostico
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  test-launch:
    name: Diagnóstico (${{ matrix.build-type }} - API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: [build-apks]
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        include:
          - api-level: 34
            target: google_apis
            arch: x86_64
            profile: "Modern Phone (API 34)"
          - api-level: 22
            target: default
            arch: x86
            profile: "Low-RAM 1GB Phone (API 22)"

    steps:
      - name: Habilitar KVM no Runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Baixar APKs compilados
        uses: actions/download-artifact@v4
        with:
          name: apks-para-diagnostico
          path: apks/

      - name: Executar e Diagnosticar no Emulador (60s)
        uses: reactivecircus/android-emulator-runner@v2.30.1
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          avd-name: diag_avd
          script: |
            mkdir -p build/diag-artifacts
            APK_FILE="apks/app-${{ matrix.build-type }}.apk"
            PACKAGE_NAME="com.luminatv.player"
            MAIN_ACTIVITY="com.luminatv.player.MainActivity"

            echo "==> Instalando $APK_FILE no emulador API ${{ matrix.api-level }}..."
            adb wait-for-device
            while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
              sleep 2
            done
            adb install -r "$APK_FILE"

            echo "==> Limpando logs e iniciando $PACKAGE_NAME..."
            adb logcat -c || true
            adb shell am start -n "$PACKAGE_NAME/$MAIN_ACTIVITY"

            echo "==> Aguardando até 60 segundos pela inicialização estável..."
            STABLE_FOUND=0
            CRASH_FOUND=0

            for i in $(seq 1 20); do
              sleep 3
              # Verifica se o processo ainda está vivo
              PID=$(adb shell pidof "$PACKAGE_NAME" || true)
              if [ -z "$PID" ]; then
                echo "[ALERTA] Processo não encontrado na iteração $i!"
                CRASH_FOUND=1
                break
              fi

              # Checa logs por marcador de estabilidade ou erro fatal
              if adb logcat -d | grep -E "(LUMINA_APP_STABLE_READY|LUMINA_JS_BOOT_COMPLETE)" >/dev/null; then
                echo "[OK] Marcador de abertura estável encontrado no logcat!"
                STABLE_FOUND=1
                break
              fi

              if adb logcat -d | grep -E "(FATAL EXCEPTION|ANR in $PACKAGE_NAME)" >/dev/null; then
                echo "[ERRO] Exceção fatal ou ANR detectado!"
                CRASH_FOUND=1
                break
              fi
            done

            echo "==> Coletando artefatos de diagnóstico..."
            adb logcat -d > build/diag-artifacts/logcat.txt || true
            adb shell dumpsys activity activities > build/diag-artifacts/dumpsys_activities.txt || true
            adb shell dumpsys meminfo "$PACKAGE_NAME" > build/diag-artifacts/dumpsys_meminfo.txt || true
            adb shell screencap -p /sdcard/screenshot.png || true
            adb pull /sdcard/screenshot.png build/diag-artifacts/screenshot.png || true
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml build/diag-artifacts/uiautomator_dump.xml || true
            adb logcat -d -s chromium:V LuminaBoot:V LuminaProxy:V LuminaExo:V LuminaJsError:V LuminaConsole:V AndroidRuntime:E > build/diag-artifacts/console_messages.txt || true
            adb shell run-as "$PACKAGE_NAME" cat files/last_crash.txt > build/diag-artifacts/last_crash.txt 2>/dev/null || adb shell cat /data/data/$PACKAGE_NAME/files/last_crash.txt > build/diag-artifacts/last_crash.txt 2>/dev/null || true

            echo "========================================================================"
            echo "==> RESUMO DAS 80 LINHAS MAIS RELEVANTES DE ERRO / LOGCAT:"
            echo "========================================================================"
            if [ -s build/diag-artifacts/last_crash.txt ]; then
              echo "--- ARQUIVO DE CRASH NATIVO (last_crash.txt) ---"
              cat build/diag-artifacts/last_crash.txt
            fi
            echo "--- LOGCAT DE ERROS E MENSAGENS LUMINA (últimas 80 linhas) ---"
            grep -E "(Lumina|chromium|AndroidRuntime|FATAL|Exception|Error)" build/diag-artifacts/logcat.txt | tail -n 80 || tail -n 80 build/diag-artifacts/logcat.txt

            if [ "$CRASH_FOUND" -eq 1 ] || [ "$STABLE_FOUND" -eq 0 ]; then
              echo "::error::App falhou na abertura: CRASH_FOUND=$CRASH_FOUND, STABLE_FOUND=$STABLE_FOUND"
              exit 1
            fi

            echo "[SUCESSO] Diagnóstico concluído: app iniciou e alcançou a tela principal!"

      - name: Upload de Artefatos de Diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-artifacts-${{ matrix.build-type }}-api-${{ matrix.api-level }}
          path: build/diag-artifacts/
          if-no-files-found: ignore
